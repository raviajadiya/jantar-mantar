name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Export Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install NPM Dependencies
        run: npm install

      - name: Sync Web Assets to Android
        run: npx cap sync android

      - name: Grant Execute Permission to Gradlew
        run: chmod +x android/gradlew

      - name: Compile Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK for Download
        run: |
          mkdir -p release-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk release-apk/Jantar-Mantar-2.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jantar-Mantar-2.0-Android-APK
          path: release-apk/Jantar-Mantar-2.0.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: release-apk
          name: "Jantar Mantar 2.0 Android APK"
          body: |
            ### 📱 Jantar Mantar 2.0 - Android APK Release
            - **Game Version:** 1.0 (Mobile Ready)
            - **Features:** Enlarged characters, 2D circular map, touch controls, sound effects & celebration blast.
            - **Download:** Click on `Jantar-Mantar-2.0.apk` below to download directly to your Android device!
          files: release-apk/Jantar-Mantar-2.0.apk
          draft: false
          prerelease: false
